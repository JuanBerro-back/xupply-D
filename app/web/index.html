<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="color-scheme" content="light dark" />

    <title>Xupply — Plataforma B2B para restaurantes y proveedores de alimentos</title>
    <meta
      name="description"
      content="Xupply conecta restaurantes con proveedores de alimentos: catálogo de insumos, pedidos, inventario, facturación electrónica y seguimiento logístico en tiempo real."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Xupply" />
    <meta name="application-name" content="Xupply" />
    <meta
      name="keywords"
      content="restaurantes, proveedores, insumos, alimentos, pedidos, inventario, abastecimiento B2B, Colombia"
    />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Xupply" />
    <meta property="og:locale" content="es_CO" />
    <meta
      property="og:title"
      content="Xupply — Plataforma B2B para restaurantes y proveedores de alimentos"
    />
    <meta
      property="og:description"
      content="Catálogo de insumos, pedidos, inventario, facturación y logística en tiempo real para tu restaurante."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Xupply — Plataforma B2B para restaurantes y proveedores"
    />
    <meta
      name="twitter:description"
      content="Catálogo de insumos, pedidos, inventario, facturación y logística en tiempo real."
    />

    <!-- Fuentes: preconnect + carga asíncrona (no bloquean el render) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
