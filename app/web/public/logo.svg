<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Arm of X (Sky Blue) -->
  <path
    d="M 120 110 L 210 110 L 392 402 L 302 402 Z"
    fill="url(#skyGrad)"
    rx="16"
  />

  <!-- Right Arm of X (Emerald Green) -->
  <path
    d="M 392 110 L 302 110 L 120 402 L 210 402 Z"
    fill="url(#emeraldGrad)"
    rx="16"
  />

  <!-- Overlapping Central Depth Overlay -->
  <path
    d="M 230 220 L 282 220 L 256 260 Z"
    fill="#082f49"
    opacity="0.35"
  />

  <!-- Interconnected Supply / Logistics Circuit Nodes -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <!-- Diagonals connecting nodes -->
    <line x1="200" y1="180" x2="312" y2="332" opacity="0.9" />
    <line x1="312" y1="180" x2="200" y2="332" opacity="0.9" />
  </g>

  <!-- Node Dots with Rings -->
  <circle cx="200" cy="180" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
  <circle cx="312" cy="180" r="14" fill="#34d399" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" stroke="#0284c7" stroke-width="5" />
  <circle cx="200" cy="332" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
  <circle cx="312" cy="332" r="14" fill="#34d399" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
</svg>
