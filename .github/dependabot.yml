version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/app/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencias"
      - "backend"

  - package-ecosystem: "npm"
    directory: "/app/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencias"
      - "frontend"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencias"
      - "ci"
